version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: barriodigital-oracle
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=TuPasswordSegura123
      - APP_USER=barriodigital
      - APP_USER_PASSWORD=barriodigital
    volumes:
      - oracle_data:/opt/oracle/oradata

volumes:
  oracle_data: