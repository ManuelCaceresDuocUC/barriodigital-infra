listeners.tcp.default = 5672
management.tcp.port = 15672

# Las definiciones (exchanges, colas, bindings y política HA) se importan por la API
# desde el servicio rabbitmq-init del compose. Si se cargaran aquí con load_definitions,
# RabbitMQ dejaría de crear el vhost "/" y el usuario de RABBITMQ_DEFAULT_USER.

# Formación del clúster: ambos nodos pueden arrancar a la vez, en cualquier orden.
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
# Reintenta hasta 60 s (30 x 2 s) mientras el otro nodo termina de arrancar
cluster_formation.discovery_retry_limit = 30
cluster_formation.discovery_retry_interval = 2000
