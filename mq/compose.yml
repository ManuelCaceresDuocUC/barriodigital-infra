version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: barriodigital-rabbitmq
    ports:
      - "5672:5672"     # Puerto protocolo AMQP
      - "15672:15672"   # Management UI (Panel Web)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data: