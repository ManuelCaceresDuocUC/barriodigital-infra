networks:
  barrio-network:
    name: barrio-network
    driver: bridge

services:
  rabbitmq1:
    image: rabbitmq:3.13-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: "SECRET_COOKIE_BARRIO_DIGITAL"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?define RABBITMQ_DEFAULT_USER en mq/.env}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?define RABBITMQ_DEFAULT_PASS en mq/.env}"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - barrio-network

  rabbitmq2:
    image: rabbitmq:3.13-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: "SECRET_COOKIE_BARRIO_DIGITAL"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?define RABBITMQ_DEFAULT_USER en mq/.env}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?define RABBITMQ_DEFAULT_PASS en mq/.env}"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5673:5672"
      - "15673:15672"
    depends_on:
      rabbitmq1:
        condition: service_healthy
    networks:
      - barrio-network

  # Un solo uso: importa exchanges, colas y bindings cuando rabbitmq1 está sano.
  # Es idempotente: puede ejecutarse en cada "docker compose up".
  rabbitmq-init:
    image: curlimages/curl:8.10.1
    container_name: rabbitmq-init
    depends_on:
      rabbitmq1:
        condition: service_healthy
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?define RABBITMQ_DEFAULT_USER en mq/.env}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?define RABBITMQ_DEFAULT_PASS en mq/.env}"
    volumes:
      - ./definitions.json:/definitions.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        curl -fsS --retry 15 --retry-delay 3 --retry-connrefused
        -u "$$RABBITMQ_DEFAULT_USER:$$RABBITMQ_DEFAULT_PASS"
        -H "Content-Type: application/json"
        -X POST http://rabbitmq1:15672/api/definitions
        --data-binary @/definitions.json
        && echo "definiciones importadas"
    restart: "no"
    networks:
      - barrio-network
